# The image's single-node config (grafana/loki 3.7.10, /etc/loki/local-config.yaml) plus one limit:
# a Kong access log line arrives with about 133 structured metadata entries, over Loki's default of 128.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  max_structured_metadata_entries_count: 256

analytics:
  reporting_enabled: false
