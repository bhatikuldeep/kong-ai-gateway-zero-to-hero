# Optional: see Acme's AI traffic in Grafana. Prometheus (metrics), Loki (traffic and container logs),
# Tempo (traces), an OpenTelemetry Collector, Grafana Alloy and Grafana with Kong's official AI Gateway dashboard. Joins Part 1's Docker
# network so it can reach the data plane by name. Run it next to Part 1, from any part onwards.
name: acme-aigw-obs

services:
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus:/prometheus"]
    networks: [acme]

  loki:
    image: grafana/loki:3.7.10@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    command: ["-config.file=/etc/loki/loki.yaml"]   # single node; accepts OTLP logs
    volumes: ["./loki/loki.yaml:/etc/loki/loki.yaml:ro", "loki:/loki"]
    networks: [acme]

  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./tempo/tempo.yaml:/etc/tempo.yaml:ro", "tempo:/var/tempo"]
    networks: [acme]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otelcol/config.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [loki, tempo]
    networks: [acme]

  alloy:
    # Container logs (the data plane's error log and warnings) from Docker to Loki. Reads the Docker
    # socket read-only, and only containers of Part 1's compose project (alloy/config.alloy).
    image: grafana/alloy:v1.22.0@sha256:9acc2529bc1edb7f5b2bd801dd8334ebc80c158e3a9e5526ecd7c9a273d43189
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [acme]

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]   # this host only
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make up}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kong-ai-gateway.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on: [prometheus, loki, tempo]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 5s
      retries: 24
    networks: [acme]

networks:
  acme:
    name: acme-aigw_default   # Part 1's network
    external: true

volumes:
  prometheus: {}
  loki: {}
  tempo: {}
  grafana: {}
