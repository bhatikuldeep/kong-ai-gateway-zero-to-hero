# Part 1, Setup: the shared stack. A Kong AI Gateway data plane connected to Konnect, and Ollama.
# Later parts add services with compose profiles; this file stays the base.
name: acme-aigw

services:
  ollama:
    image: ollama/ollama:0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m                 # keep the model loaded between calls
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:0.5b}  # only these two values from .env; never the Konnect token
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-4}
    # Pull the model, then re-create it under the same name with a fixed thread count. Left alone, Ollama
    # starts one thread per CPU the container sees and generation collapses to about 1 token/s; with 4 threads
    # it ran at 175-205 tokens/s on the same machine.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$${LLM_MODEL}"
        ollama show "$${LLM_MODEL}" --modelfile | grep -q num_thread || {
          ollama cp "$${LLM_MODEL}" acme-base &&
          printf 'FROM acme-base\nPARAMETER num_thread %s\n' "$${OLLAMA_NUM_THREAD}" | ollama create "$${LLM_MODEL}" -f /dev/stdin; }
        touch /tmp/ready; wait
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      retries: 120                           # the first start downloads the model

  kong:
    # Same major.minor as the AI Gateway control plane in Konnect (patch versions may differ from 2.3). Tag and digest pinned together.
    image: kong/kong-ai-gateway:2.3.0@sha256:2df49fc79121506cf53976e9f00d1d550ed2aee5a91f0ddb86d9927947308eee
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"   # reachable from this host only; change GATEWAY_PORT in .env if 8000 is taken
    environment:
      KONG_ROLE: data_plane
      KONG_NGINX_WORKER_PROCESSES: "2"      # two workers are plenty here (the default is one per CPU)
      KONG_DATABASE: "off"
      KONG_KONNECT_MODE: "on"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CONTROL_PLANE: ${KONG_CLUSTER_CONTROL_PLANE:?run make up}
      KONG_CLUSTER_SERVER_NAME: ${KONG_CLUSTER_SERVER_NAME}
      KONG_CLUSTER_TELEMETRY_ENDPOINT: ${KONG_CLUSTER_TELEMETRY_ENDPOINT}
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: ${KONG_CLUSTER_TELEMETRY_SERVER_NAME}
      KONG_CLUSTER_CERT: /certs/tls.crt
      KONG_CLUSTER_CERT_KEY: /certs/tls.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
    volumes:
      - ./certs:/certs:ro
    # The image checks health every 60 s, so `make up` would wait a minute for a gateway that is ready in seconds.
    healthcheck:
      test: ["CMD-SHELL", "kong-health"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  ollama: {}
