# Part 2: two services next to Part 1's gateway, on Part 1's Docker network.
#   mock-llm  stand-in LLM targets (../mocks/llm), so you can see which target served each request
#   vectors   Redis Stack, the vector store for semantic routing
name: acme-aigw-lb

services:
  mock-llm:
    image: openresty/openresty:1.29.2.1-alpine@sha256:711a9c269a6e4f4b5540fe6bdb4924bba14fc95ff16a77d6da76f89a78ad3e11
    restart: unless-stopped
    volumes:
      - ../mocks/llm/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    networks: [acme]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/hits/health"]
      interval: 3s
      retries: 20

  vectors:
    image: redis/redis-stack-server:7.4.0-v8@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
    restart: unless-stopped
    # Kong writes each target's description to the vector store when it loads the configuration, and doesn't
    # write it again on its own. Without persistence, a restarted store is empty and every semantic request
    # fails with 503 ("No peers are available") until the data plane reloads. make clean removes the volume.
    environment:
      REDIS_ARGS: --appendonly yes
    volumes:
      - vectors:/data
    networks: [acme]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

volumes:
  vectors: {}

networks:
  acme:
    external: true
    name: acme-aigw_default      # Part 1's network: the gateway reaches these by service name
