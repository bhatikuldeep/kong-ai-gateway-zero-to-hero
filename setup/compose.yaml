# 000 Setup: the shared local stack. A Kong AI Gateway data plane connected to Konnect, and Ollama.
# Later episodes add services with compose profiles; this file stays the base.
name: acme-aigw

services:
  ollama:
    image: ollama/ollama:0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20

  kong:
    # Must match the AI Gateway control plane version in Konnect. Tag and digest pinned together.
    image: kong/kong-ai-gateway:2.3.0@sha256:2df49fc79121506cf53976e9f00d1d550ed2aee5a91f0ddb86d9927947308eee
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"               # the gateway, local only
    environment:
      KONG_ROLE: data_plane
      KONG_NGINX_WORKER_PROCESSES: "2"      # two workers are plenty for one laptop (the default is one per CPU)
      KONG_DATABASE: "off"
      KONG_KONNECT_MODE: "on"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CONTROL_PLANE: ${KONG_CLUSTER_CONTROL_PLANE:?run make endpoints}
      KONG_CLUSTER_SERVER_NAME: ${KONG_CLUSTER_SERVER_NAME}
      KONG_CLUSTER_TELEMETRY_ENDPOINT: ${KONG_CLUSTER_TELEMETRY_ENDPOINT}
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: ${KONG_CLUSTER_TELEMETRY_SERVER_NAME}
      KONG_CLUSTER_CERT: /certs/tls.crt
      KONG_CLUSTER_CERT_KEY: /certs/tls.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
    volumes:
      - ./certs:/certs:ro

volumes:
  ollama: {}
