# A stand-in for LLM providers, used by Part 2 to show how load balancing picks a target.
# Every target is a path: POST /<target>/v1/chat/completions answers in the OpenAI format with
# "answered by <target>", so you can see who served each request. The target name sets its behaviour:
#   ...-slow   waits 2 s before answering
#   ...-big    reports 100 times the tokens (900 instead of 9)
#   ...-429    always answers 429 (rate limited)
# Any target can be switched to failing (503) and back, and counts the requests it received:
#   GET /down/<target>   GET /up/<target>   GET /hits/<target>   (port 8081, inside the Docker network only)
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
  access_log off;
  lua_shared_dict state 1m;

  server {
    listen 8080;
    location ~ ^/(?<target>[a-z0-9-]+)/v1/chat/completions$ {
      content_by_lua_block {
        local cjson = require "cjson.safe"
        local state = ngx.shared.state
        local t = ngx.var.target
        state:incr("hits:" .. t, 1, 0)
        ngx.header["Content-Type"] = "application/json"
        if t:match("%-slow$") then ngx.sleep(2) end
        if state:get("down:" .. t) then
          ngx.status = 503
          ngx.say(cjson.encode({ error = { message = t .. " is down", type = "server_error" } }))
          return
        end
        if t:match("%-429$") then
          ngx.status = 429
          ngx.say(cjson.encode({ error = { message = "rate limited", type = "rate_limit_error" } }))
          return
        end
        local prompt, completion = 5, 4
        if t:match("%-big$") then prompt, completion = 500, 400 end
        ngx.say(cjson.encode({
          id = "mock-" .. ngx.now(), object = "chat.completion", created = ngx.time(), model = t,
          choices = { { index = 0, finish_reason = "stop",
                        message = { role = "assistant", content = "answered by " .. t } } },
          usage = { prompt_tokens = prompt, completion_tokens = completion, total_tokens = prompt + completion },
        }))
      }
    }
  }

  server {
    listen 8081;
    location ~ ^/(?<action>down|up|hits)/(?<target>[a-z0-9-]+)$ {
      content_by_lua_block {
        local state, t, a = ngx.shared.state, ngx.var.target, ngx.var.action
        if a == "down" then state:set("down:" .. t, true) elseif a == "up" then state:delete("down:" .. t) end
        ngx.say(state:get("hits:" .. t) or 0)
      }
    }
  }
}
